<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}RutaSegura{% endblock %}</title>
  <meta name="description" content="Ruta segura para mujeres en el espacio público nocturno">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="/static/manifest.json">
  <!-- Librerías servidas localmente: algunas redes bloquean unpkg/CDNs y el mapa no cargaba -->
  <script src="/static/vendor/tailwind/tailwind-3.4.17.js"></script>
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
  <style>
    html, body { height: 100%; margin: 0; background: #0f172a; color: #f1f5f9; }
    .map-tiles-dark { filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9); }
    /* Baja los controles del mapa (zoom, atribución) para que no queden bajo la barra superior */
    .leaflet-top { top: 4.5rem; }
    /* Marcadores de origen (A) y destino (B): pin con la punta en el punto exacto */
    .endpoint-icon { background: none; border: none; }
    .endpoint-pin {
      width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
      border: 2px solid #0f172a; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      display: flex; align-items: center; justify-content: center;
    }
    .endpoint-pin span { transform: rotate(45deg); color: #fff; font-weight: 800; font-size: 13px; }
    .endpoint-pin.origin { background: #10b981; }
    .endpoint-pin.destination { background: #e11d48; }
    #map.pick-mode, #map.pick-mode .leaflet-interactive { cursor: crosshair; }
    :focus-visible { outline: 3px solid #facc15; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="min-h-screen antialiased">
  {% block content %}{% endblock %}
  <script src="/static/vendor/leaflet/leaflet.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
