{% extends "base.html" %}
{% block title %}RutaSegura · Acceso{% endblock %}
{% block content %}
<main class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm bg-slate-900 rounded-2xl p-6 space-y-4 shadow-xl">
    <h1 class="text-xl font-bold text-center">RutaSegura</h1>

    <div class="flex rounded-lg overflow-hidden border border-slate-700" role="tablist">
      <button id="tab-login" type="button" role="tab" aria-selected="true" aria-controls="login-form"
        class="flex-1 min-h-[44px] bg-slate-700 font-semibold focus-visible:outline">Iniciar sesión</button>
      <button id="tab-register" type="button" role="tab" aria-selected="false" aria-controls="register-form"
        class="flex-1 min-h-[44px] bg-slate-800 font-semibold focus-visible:outline">Crear cuenta</button>
    </div>

    <form id="login-form" aria-label="Iniciar sesión" class="space-y-3">
      <div>
        <label for="login-email" class="block text-sm font-medium mb-1">Correo</label>
        <input id="login-email" type="email" required autocomplete="email"
          class="w-full min-h-[44px] rounded-lg bg-slate-800 border border-slate-600 px-3 focus-visible:outline">
      </div>
      <div>
        <label for="login-password" class="block text-sm font-medium mb-1">Contraseña</label>
        <input id="login-password" type="password" required autocomplete="current-password" minlength="8"
          class="w-full min-h-[44px] rounded-lg bg-slate-800 border border-slate-600 px-3 focus-visible:outline">
      </div>
      <button type="submit"
        class="w-full min-h-[44px] rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-semibold focus-visible:outline">Entrar</button>
    </form>

    <form id="register-form" aria-label="Crear cuenta" class="hidden space-y-3">
      <div>
        <label for="register-name" class="block text-sm font-medium mb-1">Nombre</label>
        <input id="register-name" type="text" required
          class="w-full min-h-[44px] rounded-lg bg-slate-800 border border-slate-600 px-3 focus-visible:outline">
      </div>
      <div>
        <label for="register-email" class="block text-sm font-medium mb-1">Correo</label>
        <input id="register-email" type="email" required autocomplete="email"
          class="w-full min-h-[44px] rounded-lg bg-slate-800 border border-slate-600 px-3 focus-visible:outline">
      </div>
      <div>
        <label for="register-password" class="block text-sm font-medium mb-1">Contraseña (mín. 8 caracteres)</label>
        <input id="register-password" type="password" required minlength="8" autocomplete="new-password"
          class="w-full min-h-[44px] rounded-lg bg-slate-800 border border-slate-600 px-3 focus-visible:outline">
      </div>
      <fieldset class="space-y-3 border-t border-slate-700 pt-4">
        <legend class="text-base font-semibold">Contactos de emergencia</legend>
        <p class="text-sm text-slate-300">
          Si mantienes presionado <strong class="text-red-400">SOS</strong>, podrás avisarles por WhatsApp
          con tu ubicación en un solo toque.
        </p>
        <div id="register-contacts" class="space-y-3"></div>
        <button id="add-contact-row" type="button"
          class="w-full min-h-[44px] rounded-lg border border-dashed border-slate-500 text-slate-200 font-medium focus-visible:outline">
          + Agregar otro contacto
        </button>
      </fieldset>
      <button type="submit"
        class="w-full min-h-[44px] rounded-lg bg-sky-600 hover:bg-sky-500 text-white font-semibold focus-visible:outline">Registrarme</button>
    </form>

    <p id="auth-status" class="text-sm text-center min-h-[1.25rem]" role="status" aria-live="polite"></p>
    <a href="/" class="block text-center text-sm text-slate-400 underline focus-visible:outline">Volver al mapa</a>
  </div>
</main>
{% endblock %}
{% block scripts %}
<script src="/static/js/app.js" defer></script>
{% endblock %}
